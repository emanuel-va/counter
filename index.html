<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Counter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <section class="settings">
                <h2></h2>
                <form class="wrapper">
                    <label for="what">What to count</label>
                    <input id="what" type="text" placeholder="Item">
                    <label for="iteration">Iteration</label>
                    <input id="iteration" type="text" placeholder="Name">
                    <label for="target">Target</label>
                    <input id="target" type="number" placeholder="0">
                    <label for="min">Min average</label>
                    <input id="min" type="number" placeholder="0">
                </form>
                <span class="alert"></span>
                <div class="button-wrapper">
                    <button></button>
                    <button disabled></button>
                </div>
            </section>
            <section>
                <h2></h2>
                <div class="wrapper">
                    <span>Total:</span>
                    <span class="value">-</span>
                    <span>Remaining:</span>
                    <span class="value">-</span>
                    <span>Average:</span>
                    <span class="value">-</span>
                    <span>Max:</span>
                    <span class="value">-</span>
                    <span>Min:</span>
                    <span class="value">-</span>
                    <span class="iteration"></span>
                    <span class="value">-</span>
                    <span>Progress:</span>
                    <span class="value">-</span>
                </div>
                <div class="bar"></div>
            </section>
            <section>
                <h2></h2>
                <div>
                    <input class="add-input" type="number" inputmode="numeric" placeholder="0" disabled>
                    <span class="alert"></span>
                    <button disabled></button>
                </div>
            </section>
            <section>
                <h2></h2>
                <div class="history"></div>
            </section>
        </main>
        <script type="module" src="scripts/script.js"></script>
    </body>
</html>
