<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Counter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <section class="settings">
                <h2>Settings</h2>
                <form class="wrapper">
                    <label for="what">What to count</label>
                    <input id="what" type="text" placeholder="Item">
                    <label for="iteration">Iteration</label>
                    <input id="iteration" type="text" placeholder="Name">
                    <label for="target">Target</label>
                    <input id="target" type="number" placeholder="0">
                    <label for="min">Min average</label>
                    <input id="min" type="number" placeholder="0">
                </form>
                <span class="alert"></span>
                <div class="button-wrapper">
                    <button>Save</button>
                    <button disabled>Reset</button>
                </div>
            </section>
            <section>
                <h2>Statistics</h2>
                <div class="wrapper">
                    <span>Total:</span>
                    <span></span>
                    <span>Average:</span>
                    <span></span>
                    <span>Remaining:</span>
                    <span></span>
                    <span>Max:</span>
                    <span></span>
                    <span>Min:</span>
                    <span></span>
                    <span></span>
                    <span></span>
            </section>
            <section>
                <h2>Add</h2>
                <form>
                    <input type="number" inputmode="numeric" placeholder="0">
                    <button disabled>Count</button>
                </form>
            </section>
            <section>
                <h2>History</h2>
                <div>
                    <span>Empty</span>
                </div>
            </section>
        </main>
        <script type="module" src="scripts/script.js"></script>
    </body>
</html>
